# CSF continuous-integration gate.
#
# What CI can and cannot check: the evaluation corpora (CSIC, ECML) and the
# frozen holdout are NOT in the repository (they are licensed datasets, and
# data/ is gitignored), so the recall/FPR benchmarks are not CI gates -- they
# are run by a maintainer who has the data, and their results are committed
# under docs/benchmarks/. CI gates everything that travels with the code:
# lint, types, the full test suite, the Go sidecar build, and the supply-chain
# scans. A merge that breaks any of these is blocked.

name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync from the lockfile (reproducible install)
        run: uv sync --frozen --extra dev --extra s3 --extra security
      - name: Lint (ruff)
        run: uv run ruff check csf/ tests/ scripts/
      - name: Types (mypy --strict)
        run: uv run mypy --strict csf/
      - name: Tests
        run: uv run pytest -q
      - name: Dependency vulnerabilities (pip-audit)
        run: uv run pip-audit

  sidecar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: s1-sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: gofmt (must be clean)
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=0 go build ./...
      - name: Go vulnerabilities (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both container images
        run: docker compose build
