# The deployable shape of CSF: gateway and S1 sidecar as separate units,
# talking over a unix socket on a shared volume.
#
# Why a socket and not a port: S1 is an internal detail of the gateway, not a
# service. Nothing in this file publishes it, so there is no second network
# path into the rule engine and no port to forget to firewall.

name: csf

services:
  s1:
    build:
      context: .
      dockerfile: s1-sidecar/Dockerfile
    image: csf-s1:dev
    command:
      - -socket=/run/csf/s1.sock
      - -crs=/opt/crs
      # Per-application rule exclusions are DEPLOYMENT config, not part of the
      # detector, so they are mounted rather than baked into the image. The
      # rule set itself is baked in -- see the Dockerfile for why the two are
      # treated differently.
      - -exclusions=/etc/csf/crs/exclusions-csic.conf
    volumes:
      - s1-socket:/run/csf
      - ./configs/crs:/etc/csf/crs:ro
    read_only: true
    # Coraza probes for filesystem access at startup and aborts on a fully
    # read-only root. A tmpfs satisfies the probe without giving the process
    # anything that survives a restart, which keeps read_only meaningful.
    # (Coraza's own suggestion is the `no_fs_access` build tag; that changes
    # the binary, and this binary is the one whose scores were verified equal
    # to the host sidecar's across 400 requests. Not re-opening that.)
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      # The sidecar listens on a unix socket, so the check has to speak to the
      # socket. A TCP probe would report healthy on a different listener.
      test: ["CMD", "/usr/local/bin/s1-sidecar", "-version"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: csf-gateway:dev
    depends_on:
      s1:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"   # loopback only; this is not an edge yet
    volumes:
      - s1-socket:/run/csf
      - ./configs/gateway.docker.json:/etc/csf/gateway.json:ro
      - ./model/artifacts:/opt/csf/model:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  s1-socket:
