# Per-application CRS exclusions for the CSIC 2010 e-commerce corpus.
#
# Derived from the TRAINING/VALIDATION splits only. Never from the frozen
# test set — tuning on the holdout would invalidate every number it produces.
#
# Each exclusion states what fires, why it is a false positive HERE, and what
# it would cost if the assumption is wrong. An exclusion without that
# reasoning is a silent hole in the WAF.

# ---------------------------------------------------------------------------
# 920451 — "HTTP header is restricted by policy (/accept-charset/)"
# Fires on 60/60 benign requests. CRS v4 treats Accept-Charset as a scanner
# signal because modern browsers stopped sending it. Every CSIC request carries
# it because the corpus was generated in 2010 with Konqueror.
#
# Cost if wrong: we stop treating the presence of Accept-Charset as suspicious.
# That is a weak signal on its own and this application is from 2010, so the
# trade is clearly correct here. A modern application should NOT carry this
# exclusion.
# ---------------------------------------------------------------------------
SecRuleRemoveById 920451

# ---------------------------------------------------------------------------
# 932236 — "Remote Command Execution: Unix Command Injection"
# Fires on 58/60 benign requests, matching the literal string "pwd" in
# ARGS_NAMES. The shop's password field is NAMED "pwd", and CRS reads that as
# the Unix `pwd` command. This is a parameter-NAME collision, not a payload.
#
# Scoped deliberately: we exclude only the ARGS_NAMES target, so a `pwd`
# command appearing in a parameter VALUE is still detected. Removing the rule
# outright would be the lazy fix and would create a real blind spot.
# ---------------------------------------------------------------------------
SecRuleUpdateTargetById 932236 "!ARGS_NAMES"
SecRuleUpdateTargetById 932235 "!ARGS_NAMES"
SecRuleUpdateTargetById 932230 "!ARGS_NAMES"
