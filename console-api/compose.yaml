# Full CSF demo: Go/Coraza S1 sidecar + gateway + demo shop + console API.
# Run from this folder:  docker compose up -d --build
# (Uses the team's s1-sidecar build unchanged; only adds the console service.)
name: csf-console

services:
  s1:
    build:
      context: ..
      dockerfile: s1-sidecar/Dockerfile
    image: csf-s1:dev
    command:
      - -socket=/run/csf/s1.sock
      - -crs=/opt/crs
      - -exclusions=/etc/csf/crs/exclusions-csic.conf
    volumes:
      - s1-socket:/run/csf
      - ../configs/crs:/etc/csf/crs:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/usr/local/bin/s1-sidecar", "-version"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  console:
    build:
      context: ..
      dockerfile: console-api/Dockerfile
    image: csf-console:dev
    depends_on:
      s1:
        condition: service_healthy
    environment:
      CSF_S1_SOCKET: /run/csf/s1.sock
      CSF_CONSOLE_BIND: 0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"   # console API
      - "127.0.0.1:8080:8080"   # gateway (HTTPS, self-signed)
    volumes:
      - s1-socket:/run/csf
      - runtime:/app/console-api/.runtime
      - ../docs/benchmarks:/app/docs/benchmarks:ro

volumes:
  s1-socket:
  runtime:
